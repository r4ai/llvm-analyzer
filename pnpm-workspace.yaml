packages:
  - "packages/*"

# --- サプライチェーン対策 ---
# 公開から24時間(1440分)未満の新しいバージョンはインストールしない。
# 公開直後に乗っ取られたリリースを即座に取り込むのを防ぐ。
minimumReleaseAge: 1440

# 依存パッケージのライフサイクルスクリプト(postinstall等)は既定でブロックし、
# ここに列挙したものだけ実行を許可する(明示allowlist)。
onlyBuiltDependencies: []

# 全依存のビルドスクリプトを無条件許可しない。
dangerouslyAllowAllBuilds: false

# スクリプト実行前に node_modules がロックファイルと一致するか検証する。
verifyDepsBeforeRun: warn
