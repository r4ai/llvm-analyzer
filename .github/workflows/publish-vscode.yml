name: Publish VS Code Extension

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: vscode-marketplace-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build VSIX
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter llvm-analyzer-vscode package
      - name: Record VSIX checksum
        run: sha256sum packages/vscode-extension/llvm-analyzer-vscode.vsix > packages/vscode-extension/llvm-analyzer-vscode.vsix.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: llvm-analyzer-vscode-vsix
          path: |
            packages/vscode-extension/llvm-analyzer-vscode.vsix
            packages/vscode-extension/llvm-analyzer-vscode.vsix.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to VS Code Marketplace
    needs: package
    runs-on: ubuntu-latest
    environment: vscode-marketplace
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: llvm-analyzer-vscode-vsix
          path: packages/vscode-extension
      - name: Verify VSIX checksum
        run: sha256sum --check packages/vscode-extension/llvm-analyzer-vscode.vsix.sha256
      - uses: azure/login@1384c340ab2dda50fed2bee3041d1d87018aa5e8 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Publish VSIX
        env:
          AZURE_CORE_OUTPUT: none
        run: pnpm --filter llvm-analyzer-vscode exec vsce publish --azure-credential --skip-duplicate --packagePath llvm-analyzer-vscode.vsix
